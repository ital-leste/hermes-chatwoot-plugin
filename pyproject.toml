[project]
name = "hermes-chatwoot-plugin"
version = "0.2.0rc3"
description = "Hermes tools backed by an external Python Chatwoot Application API client"
requires-python = ">=3.11"
# BLOQUEIO DISTRIBUICAO: pacote cliente ainda nao publicado em indice e licencia pendente.
# Ate publicacao, instalar chatwoot_client separadamente no Python do Hermes.
# Nao usar dependencias por URL Git aqui: Hermes PM nao as suporta.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
