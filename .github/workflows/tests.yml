name: Testes Python
on:
  push:
    branches: [main, homolog]
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencias de testes e Chatwoot Client com SHA fixo
        run: |
          python -m pip install 'pytest==9.2.0' 'PyYAML==6.0.3' 'jsonschema==4.26.0'
          python -m pip install 'git+https://github.com/ital-leste/chatwoot-client.git@cf4662a58e8b9b96adcb53902afb923e1350d2cd'
          python -c 'from chatwoot_client import CWClient, Contact; print("SDK Chatwoot carregado")'
          python -m pip check
          python -m pip freeze
      - name: Suite unitária e contratos com SDK real/MockTransport
        run: python -m pytest -q -ra
      - name: Validação estática
        run: python -m compileall -q chatwoot_tools schemas.py tests
