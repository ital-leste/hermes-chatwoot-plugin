name: chatwoot-tools
version: 0.2.0-rc.4
description: Ferramentas para a Application API do Chatwoot via chatwoot_client.
provides_tools:
  - chatwoot_get_conversation
  - chatwoot_list_conversations
  - chatwoot_list_messages
  - chatwoot_send_public_message
  - chatwoot_send_private_note
  - chatwoot_set_status
  - chatwoot_add_labels
  - chatwoot_remove_labels
  - chatwoot_search_contacts
  - chatwoot_get_contact
  - chatwoot_get_contact_conversations
  - chatwoot_update_contact
config_schema:
  base_url_env:
    type: str
    required: true
    label: Variável com a URL Chatwoot no perfil
  credentials:
    type: dict
    required: true
    description: Identidades de usuário, nome da variável de token e única conta vinculada a cada identidade.
  allow_insecure_http:
    type: bool
    default: false
    description: Permitir HTTP fora do loopback somente para redes controladas.
  allowed_operations:
    type: dict
    required: true
    description: Operacoes autorizadas; apenas linhas com true permitem execucao.
  writable_contact_fields:
    type: dict
    required: false
    description: Campos do contato cuja atualizacao esta autorizada.
